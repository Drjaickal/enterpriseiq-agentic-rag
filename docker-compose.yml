services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterpriseiq-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: enterpriseiq
      POSTGRES_USER: enterpriseiq
      POSTGRES_PASSWORD: enterpriseiq_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriseiq -d enterpriseiq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
